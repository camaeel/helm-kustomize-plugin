name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: latest

      - name: Set up ORAS
        uses: oras-project/setup-oras@v2

      - name: Set plugin version from release tag
        uses: mikefarah/yq@v4
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          cmd: yq -i '.version = (strenv(RELEASE_TAG) | sub("^v"; ""))' plugin.yaml

      - name: Read plugin name
        id: plugin
        uses: mikefarah/yq@v4
        with:
          cmd: yq -r '.name' plugin.yaml

      - name: Package plugin
        id: package
        env:
          PLUGIN_NAME: ${{ steps.plugin.outputs.result }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          NAME=$(printf '%s' "$PLUGIN_NAME" | tr -d '\r\n')
          VERSION=${RELEASE_TAG#v}
          ARCHIVE="$NAME-$VERSION.tgz"

          if [ -z "$NAME" ] || [ -z "$VERSION" ]; then
            echo "Could not determine plugin name and version" >&2
            exit 1
          fi

          mkdir -p dist
          helm plugin package --sign=false .
          mv "$ARCHIVE" dist/
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push plugin to OCI registry
        env:
          NAME: ${{ steps.package.outputs.name }}
          VERSION: ${{ steps.package.outputs.version }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          oras push "ghcr.io/${GITHUB_REPOSITORY}/${NAME}:${VERSION}" \
            --artifact-type application/vnd.helm.plugin.v1+json \
            "dist/${ARCHIVE}"

      # - name: Attach package to Release Please release
      #   env:
      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #     ARCHIVE: ${{ steps.package.outputs.archive }}
      #   run: gh release upload "$GITHUB_REF_NAME" "dist/$ARCHIVE"
