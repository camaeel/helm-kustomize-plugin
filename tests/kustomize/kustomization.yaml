apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - base.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: release-name-test-chart
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: release-name-test-chart
      spec:
        replicas: 99